<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ---------- identity ---------- -->
    <title>Pentecostal Penuel Church | Ruyenzi, Kamonyi — Rwanda</title>
    <meta
      name="description"
      content="Pentecostal Penuel Church in Ruyenzi Sector, Kamonyi District, Rwanda. Founded in 1998. Sunday worship 9:00 AM, youth 2:00 PM, Saturday revival fasting prayer. Everyone is welcome."
    />
    <link rel="canonical" href="https://penuelpentecostalchurch.org/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="theme-color" content="#544833" />
    <meta name="author" content="Pentecostal Penuel Church" />

    <!-- ---------- social ---------- -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pentecostal Penuel Church" />
    <meta property="og:title" content="Pentecostal Penuel Church | Ruyenzi, Kamonyi — Rwanda" />
    <meta
      property="og:description"
      content="A Pentecostal church in Ruyenzi, Kamonyi District, Rwanda. Founded in 1998. Everyone is welcome — come as you are."
    />
    <meta property="og:url" content="https://penuelpentecostalchurch.org/" />
    <meta property="og:image" content="https://penuelpentecostalchurch.org/images/hero-worship.jpg" />
    <meta property="og:image:alt" content="Worshippers with hands raised at Pentecostal Penuel Church" />
    <meta property="og:locale" content="en" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pentecostal Penuel Church | Ruyenzi, Kamonyi — Rwanda" />
    <meta
      name="twitter:description"
      content="A Pentecostal church in Ruyenzi, Kamonyi District, Rwanda. Founded in 1998. Everyone is welcome."
    />
    <meta name="twitter:image" content="https://penuelpentecostalchurch.org/images/hero-worship.jpg" />

    <!-- ---------- privacy ---------- -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!--
      Backend location. Changing these two values re-points the whole app;
      no URL is hard-coded anywhere in the JavaScript.
      `admin-api-path` MUST match ADMIN_API_PATH on the server.
    -->
    <meta name="api-url" content="https://api.penuelpentecostalchurch.org/api" />
    <meta name="admin-api-path" content="https://api.penuelpentecostalchurch.org/api/mgmt-7f3a91" />

    <!-- ---------- performance ---------- -->
    <!-- Warm up connections to the image CDNs while the HTML is still
         parsing, so photographs start arriving immediately instead of
         waiting on a DNS lookup + TLS handshake. -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://www.rccgfcorleans.org" />
    <link rel="dns-prefetch" href="https://www.rccgfcorleans.org" />
    <link rel="preconnect" href="https://api.penuelpentecostalchurch.org" crossorigin />

    <!-- Hero photograph is the largest visible element on first paint. -->
    <link rel="preload" as="image" href="/images/hero-worship.jpg" fetchpriority="high" />

    <link rel="icon" href="https://res.cloudinary.com/z2vslzvr/image/upload/v1789970157/penuel_logo_transparent.png" type="image/png" />
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/z2vslzvr/image/upload/v1789970157/penuel_logo_transparent.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- ---------- structured data (helps Google show service times) ---------- -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Church",
        "name": "Pentecostal Penuel Church",
        "url": "https://penuelpentecostalchurch.org",
        "image": "https://penuelpentecostalchurch.org/images/church-building.jpg",
        "description": "A Pentecostal church where people meet God, are transformed by His presence, and receive His blessing for their spiritual and physical lives.",
        "foundingDate": "1998",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Ruyenzi Sector, Kamonyi District",
          "addressCountry": "Rwanda"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Sunday",
            "opens": "09:00",
            "closes": "17:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Saturday",
            "opens": "09:00",
            "closes": "15:00"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="preloader" class="preloader" aria-hidden="true">
      <div class="preloader-inner">
        <img
          src="https://res.cloudinary.com/z2vslzvr/image/upload/f_auto,q_auto,w_128/v1789970157/penuel_logo_transparent.png"
          alt="Pentecostal Penuel Church Logo"
          style="width: 48px; height: 48px; margin: 0 auto 12px; display: block; object-fit: contain;"
        />
        <div class="preloader-name">PENUEL</div>
        <div class="preloader-sub">PENTECOSTAL PENUEL CHURCH</div>
        <div>
          <span class="preloader-dot"></span>
          <span class="preloader-dot"></span>
          <span class="preloader-dot"></span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <noscript>
      <div style="font-family: Georgia, serif; padding: 2rem; text-align: center">
        <h1>Pentecostal Penuel Church</h1>
        <p>Ruyenzi Sector, Kamonyi District, Rwanda. Sunday worship at 9:00 AM — everyone welcome.</p>
        <p>Please enable JavaScript to view the full site, or call +250 794 770 542.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
